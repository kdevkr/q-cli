[package]
name = "q-cli"
version = "0.1.0"
edition = "2021"
description = "Native kdb+/q IPC client CLI (query / run / ping) with text or JSON output"

[[bin]]
name = "q-cli"
path = "src/main.rs"

[profile.release]
opt-level = 2
lto = true
strip = true
panic = "abort"

[features]
default = []
tls = ["dep:native-tls"]

[dependencies]
unicode-width = "0.2.2"
native-tls = { version = "0.2", optional = true }
